<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">From relative signal to traceable absolute intensity</title>
  <desc id="desc">A compact SAXS calibration sequence connects detector data and reference intensity to a provenance-bearing absolute result.</desc>
  <rect width="1200" height="300" rx="24" fill="#0B1118"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="55" fill="#8FA3B5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="2.2">THE CALIBRATION RECORD STAYS WITH THE RESULT</text>
    <text x="56" y="115" fill="#F4F7FA" font-size="38" font-weight="700">relative signal</text>
    <text x="478" y="115" fill="#F4F7FA" font-size="38" font-weight="700">reference K</text>
    <text x="842" y="115" fill="#F4F7FA" font-size="38" font-weight="700">absolute I(q)</text>
    <path d="M284 100H430" stroke="#5B7083" stroke-width="3"/>
    <path d="M418 91L432 100L418 109" fill="none" stroke="#5B7083" stroke-width="3"/>
    <path d="M694 100H794" stroke="#5B7083" stroke-width="3"/>
    <path d="M782 91L796 100L782 109" fill="none" stroke="#5B7083" stroke-width="3"/>
    <g transform="translate(56 156)">
      <path d="M0 61H1080" stroke="#293743"/>
      <path d="M4 44C34 40 60 36 88 27C118 18 145 13 180 9" fill="none" stroke="#62B0E8" stroke-width="4"/>
      <circle cx="4" cy="44" r="4" fill="#62B0E8"/><circle cx="88" cy="27" r="4" fill="#62B0E8"/><circle cx="180" cy="9" r="4" fill="#62B0E8"/>
      <rect x="426" y="2" width="212" height="50" rx="8" fill="#131F2A" stroke="#F0A04B"/>
      <text x="532" y="34" text-anchor="middle" fill="#F4F7FA" font-size="21" font-weight="650">robust estimate</text>
      <path d="M790 43C820 39 847 33 876 24C908 15 936 10 972 7" fill="none" stroke="#69C0A5" stroke-width="4"/>
      <text x="0" y="94" fill="#8FA3B5" font-size="18">detector + metadata</text>
      <text x="426" y="94" fill="#8FA3B5" font-size="18">reference + diagnostics</text>
      <text x="790" y="94" fill="#8FA3B5" font-size="18">value + units + provenance</text>
    </g>
  </g>
</svg>
